name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repository safety policy
        run: sh scripts/check-repository-policy.sh

      - name: Build benign fixtures
        run: make all

      - name: Inspect fixture
        run: |
          set -x
          file build/unknown-01
          readelf -h build/unknown-01
          readelf -h build/elf-lab
          readelf -r build/elf-lab
          file build/static-lab
          ./build/static-lab 123 >/tmp/static.txt
          grep -Eq "^class [AB]$" /tmp/static.txt
          ./build/dynamic-lab 17 | grep -Eq "^result=[0-9]+ observations=[0-9]+$"
          test "$(./build/archaeology-lab-O0 3 9)" = "$(./build/archaeology-lab-O1 3 9)"
          test "$(./build/archaeology-lab-O1 3 9)" = "$(./build/archaeology-lab-O2 3 9)"
          ./build/structure-lab | grep -q "^total=26$"
          test "$(./build/diff-v1 7)" = "22"
          test "$(./build/diff-v2 7)" = "22"
          test "$(./build/diff-v1 11)" = "18"
          test "$(./build/diff-v2 11)" = "34"
          ./build/defensive-lab | grep -q "^config:version=1;mode=training$"
          strings -a build/defensive-lab >/tmp/defensive.strings
          grep -q "telemetry.example.com" /tmp/defensive.strings
          grep -q "192.0.2.42" /tmp/defensive.strings
          python3 tools/hunk_info.py build/minimal.hunk >/tmp/hunk.txt
          grep -q "^HUNK_HEADER table=1 first=0 last=0$" /tmp/hunk.txt
          grep -q "^HUNK_CODE longs=1 bytes=702a4e75$" /tmp/hunk.txt
          grep -q "^HUNK_END$" /tmp/hunk.txt
          python3 tools/hunk_records.py build/reloc.hunk >/tmp/hunk-reloc.txt
          grep -q "^HUNK_HEADER table=3 first=0 last=2 sizes=\[2, 1, 2\]$" /tmp/hunk-reloc.txt
          grep -q "^HUNK_RELOC32 source=0 target=1 offsets=\[2\]$" /tmp/hunk-reloc.txt
          grep -q "^HUNK_SYMBOL hunk=0 name=entry value=0$" /tmp/hunk-reloc.txt
          grep -q "^HUNK_DATA hunk=1 longs=1 bytes=12345678$" /tmp/hunk-reloc.txt
          grep -q "^HUNK_BSS hunk=2 longs=2$" /tmp/hunk-reloc.txt
          file build/case-01 | grep -q "ELF 64-bit"
          test "$(./build/case-01 0 | cut -d= -f1)" = "result"
          set +e
          ./build/case-01 nope >/tmp/case01.out 2>/tmp/case01.err
          case_rc=$?
          set -e
          test "$case_rc" -eq 3
          grep -q "^case-01: invalid input$" /tmp/case01.err
          file build/case-02 | grep -q "ELF 64-bit"
          ./build/case-02 17 5 | grep -Eq "^result=(north|east|south|west) value=[0-9]+$"
          set +e
          ./build/case-02 18 5 >/tmp/case02.out
          case2_rc=$?
          set -e
          test "$case2_rc" -eq 4
          grep -q "^result=unknown$" /tmp/case02.out
          strings -a build/case-02 >/tmp/case02.strings
          grep -q "diagnostic-mode:quartz" /tmp/case02.strings
          file build/pe-lab.exe | grep -Eq "PE32\+ executable.*x86-64|PE32\+ executable.*x86-64"
          x86_64-w64-mingw32-objdump -f build/pe-lab.exe | grep -q "pei-x86-64"
          file build/case-pe-01.exe | grep -q "PE32+ executable"
          x86_64-w64-mingw32-objdump -f build/case-pe-01.exe | grep -q "pei-x86-64"
          x86_64-w64-mingw32-objdump -p build/case-pe-01.exe >/tmp/case-pe-01.txt
          grep -q "DLL Name:" /tmp/case-pe-01.txt
          x86_64-w64-mingw32-objdump -p build/pe-lab.exe >/tmp/pe-lab.txt
          file build/edu-reversing.dll | grep -q "PE32+ executable"
          x86_64-w64-mingw32-objdump -p build/edu-reversing.dll >/tmp/pe-library.txt
          grep -q "edu_mix" /tmp/pe-library.txt
          grep -q "edu_class" /tmp/pe-library.txt
          file build/pe-resource-lab.exe | grep -q "PE32+ executable"
          x86_64-w64-mingw32-objdump -h build/pe-resource-lab.exe >/tmp/pe-resource-sections.txt
          grep -q ".rsrc" /tmp/pe-resource-sections.txt
          strings -el build/pe-resource-lab.exe >/tmp/pe-resource.strings
          grep -q "EduReversing benign PE resource" /tmp/pe-resource.strings
          file build/case-pe-02.exe | grep -q "PE32+ executable"
          x86_64-w64-mingw32-objdump -h build/case-pe-02.exe >/tmp/case-pe-02-sections.txt
          grep -q ".rsrc" /tmp/case-pe-02-sections.txt
          strings -a build/case-pe-02.exe >/tmp/case-pe-02-ascii.txt
          grep -q "training-marker:PE-CASE-05" /tmp/case-pe-02-ascii.txt
          strings -el build/case-pe-02.exe >/tmp/case-pe-02-wide.txt
          grep -q "EduReversing Case 05 training resource" /tmp/case-pe-02-wide.txt
          grep -q "telemetry.example.invalid" /tmp/case-pe-02-wide.txt
          file build/capstone-m1.exe | grep -q "PE32+ executable"
          x86_64-w64-mingw32-objdump -f build/capstone-m1.exe | grep -q "pei-x86-64"
          x86_64-w64-mingw32-objdump -h build/capstone-m1.exe >/tmp/capstone-m1-sections.txt
          grep -q ".rsrc" /tmp/capstone-m1-sections.txt
          strings -a build/capstone-m1.exe >/tmp/capstone-m1-ascii.txt
          grep -q "capstone-marker:documentation-only" /tmp/capstone-m1-ascii.txt
          strings -el build/capstone-m1.exe >/tmp/capstone-m1-wide.txt
          grep -q "EduReversing M1 Capstone" /tmp/capstone-m1-wide.txt
          grep -q "sync.example.invalid" /tmp/capstone-m1-wide.txt
          grep -q "DLL Name:" /tmp/pe-lab.txt
          file build/capstone-m0 | grep -q "ELF 64-bit"
          ./build/capstone-m0 A:hello | grep -Eq "^ticket=[0-9a-f]{8} class=[0-7]$"
          strings -a build/capstone-m0 >/tmp/capstone.strings
          grep -q "update.example.invalid" /tmp/capstone.strings
          grep -q "autorun:training-decoy" /tmp/capstone.strings
          set +e
          ./build/capstone-m0 Z:test >/dev/null
          cap_rc=$?
          set -e
          test "$cap_rc" -eq 4
          test "$(./build/unknown-01 reversing | cut -d: -f1)" = "accepted"
          set +e
          ./build/unknown-01 other >/tmp/rejected.txt
          rc=$?
          set -e
          test "$rc" -eq 1
          test "$(cut -d: -f1 </tmp/rejected.txt)" = "rejected"

  student-oci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build student image
        run: docker build -t edureversing-student:m0 -f student/Dockerfile .

      - name: Smoke test student image
        run: |
          docker run --rm edureversing-student:m0 sh -lc '
            gcc --version &&
            x86_64-w64-mingw32-gcc --version &&
            x86_64-w64-mingw32-objdump --version &&
            gdb --version &&
            objdump --version &&
            readelf --version &&
            file --version &&
            r2 -v | grep -F "6.2.2"
          '
